name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '14.16.0'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage thresholds
        run: npm run test:coverage
